name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '게시할 기존 버전 태그 (예: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test
        run: python -B -m unittest discover -s Tools/tests -p 'test_scenario_*.py'
      - name: Build release archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/build_release.py "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "Scenario CLI $RELEASE_TAG" --notes-file RELEASE_NOTES.md
